<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bridge Made Easy: Learn to Play Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --baize:#1d4e3c; --baize-d:#143a2c; --baize-l:#2a6650;
  --ivory:#f7f2e6; --paper:#fffcf5; --ink:#23201c; --muted:#6a6259;
  --mahog:#5b2a22; --brass:#c39a4a; --brass-d:#8f6c2a; --brass-l:#f0d58f;
  --line:#e2d7c2; --red:#b3261e; --blk:#1c2430; --good:#2c7a4b; --soft:#b5482f;
  --dia:var(--red); --clu:currentColor; --dia-l:#ff9d93; --clu-l:currentColor; --hea-l:#ff9d93;
}
.cH{color:var(--red)} .cD{color:var(--dia)} .cC{color:var(--clu)}
.card.cS,.card.cC{color:var(--blk);box-shadow:0 0 0 2px #2b2b2b,1px 2px 4px rgba(0,0,0,.25)}
.card.cH,.card.cD{color:var(--red);box-shadow:0 0 0 2px var(--red),1px 2px 4px rgba(0,0,0,.25)}
.auction .cH,.htxt .cH{color:var(--hea-l)} .auction .cD,.htxt .cD{color:var(--dia-l)} .auction .cC,.htxt .cC{color:var(--clu-l)}
.bb.sel .cH,.bb.sel .cD{color:#ffb3ab}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#d9cfbd;font-family:'Nunito Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:800px;height:1100px;flex:none;position:relative;background:var(--ivory);transform-origin:center center;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(50,30,15,.25)}
.red{color:var(--red)} .blk{color:var(--blk)}
button{font-family:inherit}
.btn{font-weight:800;font-size:24px;border:none;border-radius:14px;min-height:64px;padding:0 22px;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn.primary{background:var(--mahog);color:#fff;box-shadow:0 4px 0 #3a1813}
.btn.brass{background:var(--brass);color:#fff;box-shadow:0 4px 0 var(--brass-d)}
.btn:disabled{opacity:.38;cursor:default}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:none}
.btn:focus-visible,.card:focus-visible,.tile:focus-visible{outline:4px solid var(--brass);outline-offset:2px}

/* header */
header{position:absolute;top:0;left:0;right:0;height:76px;background:var(--baize-d);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ivory)}
header .title{flex:1;font-family:'Playfair Display',Georgia,serif;font-size:31px;font-weight:700;letter-spacing:.3px;text-align:center}
header .hb{min-height:56px;min-width:56px;padding:0 14px;font-size:22px;background:rgba(255,255,255,.1);color:var(--ivory);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}

.screen{position:absolute;left:0;right:0;top:76px;bottom:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* home */
#scrHome{padding:26px 36px 20px;align-items:stretch}
.hero{text-align:center;padding:0 0 16px}
.hero .suitrow{font-size:46px;letter-spacing:18px;color:var(--blk);line-height:1}
.hero h1{font-family:'Playfair Display',Georgia,serif;font-size:46px;line-height:1.1;margin:8px 0 8px;color:var(--baize-d)}
.hero p{font-size:22px;line-height:1.4;color:var(--muted);max-width:640px;margin:0 auto}
#lessonGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile.adv{background:#f4efe2}
.tile.adv .num{background:var(--mahog)}
.styleRow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font-size:21px;font-weight:700;color:var(--muted)}
.styleRow .btn{min-height:50px;font-size:21px;padding:0 20px}
.styleRow .btn.on{background:var(--baize);color:#fff;box-shadow:0 3px 0 var(--baize-d)}
#lessonGrid .tile:last-child:nth-child(odd){grid-column:1 / -1}
.tile{position:relative;background:var(--paper);border:none;border-radius:16px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);text-align:left;padding:10px 14px 8px 74px;min-height:80px;cursor:pointer;color:var(--ink)}
.tile .num{position:absolute;left:14px;top:15px;width:46px;height:46px;border-radius:50%;background:var(--baize);color:var(--ivory);font-family:'Playfair Display',serif;font-size:27px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tile.done .num{background:var(--brass)}
.tile .tt{font-size:23px;font-weight:800;line-height:1.15}
.tile .ts{font-size:17px;color:var(--muted);margin-top:2px;line-height:1.25}
.tile .ck{position:absolute;right:14px;top:12px;font-size:24px;color:var(--good);font-weight:800}
#practiceBtn{margin-top:14px;min-height:80px;font-size:29px;border-radius:18px}
#statsLine{text-align:center;font-size:19px;color:var(--muted);margin-top:10px;line-height:1.35}

/* lesson */
#scrLesson{padding:26px 40px 24px}
.lsKicker{font-size:22px;font-weight:700;color:var(--brass-d)}
#lsTitle{font-family:'Playfair Display',Georgia,serif;font-size:44px;color:var(--baize-d);line-height:1.15;margin:4px 0 18px}
.sheet{flex:1;background:var(--paper);border-radius:18px;box-shadow:inset 0 0 0 2px var(--line);padding:30px 34px;display:flex;flex-direction:column;overflow:hidden}
.sheet h3{font-family:'Playfair Display',Georgia,serif;font-size:32px;margin-bottom:16px;color:var(--ink)}
.sheet p{font-size:27px;line-height:1.5;margin-bottom:16px}
.sheet .ex{margin-top:auto;background:var(--ivory);border-radius:14px;padding:18px 22px;font-size:25px;line-height:1.55;border-left:6px solid var(--brass)}
.sheet .ex b{font-weight:800}
.dots{display:flex;justify-content:center;gap:12px;margin:18px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--baize)}
.navRow{display:flex;gap:16px;justify-content:space-between}
.navRow .btn{flex:1;min-height:78px;font-size:27px}

/* exercise */
#scrEx{padding:22px 34px 22px}
.exHead{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;color:var(--muted);font-weight:700}
#exTitle{font-family:'Playfair Display',serif;font-size:30px;color:var(--baize-d)}
.exPrompt{font-size:30px;font-weight:700;line-height:1.35;margin:16px 0 14px;min-height:84px}
.chip{display:inline-block;background:var(--paper);border-radius:10px;padding:2px 14px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800}
.felt{background:radial-gradient(ellipse at 50% 40%,var(--baize-l),var(--baize) 70%);border-radius:18px}
#exHandWrap{padding:12px 0 8px;margin:0 -8px}
.exAnswer{margin-top:16px}
.opts{display:grid;gap:12px}
.opts.four{grid-template-columns:repeat(4,1fr)}
.opts .btn{min-height:76px;font-size:25px;text-align:left;line-height:1.25;padding:10px 20px}
.opts.four .btn{text-align:center;font-size:34px}
.opts .btn.right{background:var(--good);color:#fff;box-shadow:0 4px 0 #1b5232}
.opts .btn.wrong{background:var(--soft);color:#fff;box-shadow:0 4px 0 #7d2f1e}
.results{text-align:center;padding:40px 10px}
.results .big{font-family:'Playfair Display',serif;font-size:64px;color:var(--baize-d)}
.results p{font-size:27px;line-height:1.5;color:var(--muted);margin-top:12px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.stack .btn{min-height:80px;font-size:27px}

/* coach box */
.coach{background:var(--paper);border-radius:16px;box-shadow:inset 0 0 0 2px var(--line);padding:12px 18px;display:flex;gap:14px;align-items:flex-start;overflow:hidden}
.coach .who{flex:none;width:52px;height:52px;border-radius:50%;background:var(--brass);color:#fff;font-family:'Playfair Display',serif;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.coach .ctxt{flex:1;align-self:stretch;font-size:23px;line-height:1.38;overflow:hidden}
.coach .ctxt b{font-weight:800}
.coach.good{box-shadow:inset 0 0 0 3px var(--good)}
.coach.warn{box-shadow:inset 0 0 0 3px var(--soft)}
#exFeedback{margin-top:16px;height:170px}
#exNextRow{margin-top:auto}

/* cards */
.handbox{position:relative;width:760px;height:142px;margin:0 auto}
.card{position:absolute;top:8px;width:92px;height:130px;border-radius:10px;background:#fff;box-shadow:0 0 0 1.5px #cfc5b2,1px 2px 4px rgba(0,0,0,.25);transition:transform .15s ease}
.card .ix{position:absolute;left:3px;top:4px;width:52px;display:flex;flex-direction:column;align-items:center;line-height:.95}
.card .rk{font-size:43px;font-weight:800;letter-spacing:-2.5px;font-family:Arial,'Helvetica Neue',sans-serif}
.card .st{font-size:58px;margin-top:-2px;font-family:Arial,'Segoe UI Symbol','Apple Symbols',sans-serif}
.card .pip{position:absolute;right:8px;bottom:4px;font-size:40px;line-height:1}
.handbox .card:not(:last-child) .pip{display:none}
.card.back{background:repeating-linear-gradient(45deg,#7a2f2a 0 6px,#69261f 6px 12px);box-shadow:0 0 0 3px #fff inset,0 0 0 1.5px #cfc5b2,1px 2px 3px rgba(0,0,0,.25)}
.card.small{width:60px;height:86px;top:30px}
.card.playable{cursor:pointer}
.card.playable:hover{transform:translateY(-10px)}
.card.dim::after{content:"";position:absolute;inset:0;border-radius:10px;background:rgba(40,30,20,.38)}
.card.suggest{transform:translateY(-16px);box-shadow:0 0 0 5px var(--brass-l),0 0 18px 4px rgba(240,213,143,.9)}
.card.win{box-shadow:0 0 0 5px var(--brass-l),0 0 16px 3px rgba(240,213,143,.8)}

/* table */
#scrTable{background:var(--baize)}
.tBar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--baize-d);color:var(--ivory);font-size:22px;border-top:1px solid rgba(255,255,255,.08)}
.tBar b{font-weight:800}
.tBar .pill{background:var(--ivory);color:var(--ink);border-radius:9px;padding:1px 12px;font-weight:800}
.seat{height:176px;display:flex;flex-direction:column;justify-content:center}
.seatLabel{height:34px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ivory);font-size:22px;font-weight:700}
.tag{background:rgba(255,255,255,.16);border-radius:8px;padding:0 10px;font-size:18px}
.turn{background:var(--brass-l);color:var(--ink);border-radius:9px;padding:1px 12px;font-size:20px;font-weight:800}
.middle{height:276px;display:flex;align-items:stretch;padding:0 10px}
.side{width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ivory);gap:8px}
.side .nm{font-size:22px;font-weight:800}
.side .cnt{font-size:18px;opacity:.85}
.side .backs{position:relative;width:70px;height:70px}
.side .backs i{position:absolute;width:46px;height:64px;border-radius:6px;background:repeating-linear-gradient(45deg,#7a2f2a 0 5px,#69261f 5px 10px);box-shadow:0 0 0 2px #fff inset,0 1px 3px rgba(0,0,0,.4)}
.center{flex:1;position:relative;border-radius:22px;background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.tslot{position:absolute}
.tslot .card{position:relative;top:0}
.tslot.N{left:50%;top:6px;margin-left:-46px}
.tslot.S{left:50%;bottom:6px;margin-left:-46px}
.tslot.W{left:34px;top:73px}
.tslot.E{right:34px;top:73px}
.tmsg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--ivory);font-size:22px;opacity:.85;padding:0 120px;line-height:1.35}
.auction{position:absolute;inset:14px 18px;color:var(--ivory)}
.auction table{width:100%;border-collapse:collapse;table-layout:fixed}
.auction th{font-size:19px;font-weight:700;opacity:.8;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.2)}
.auction td{text-align:center;font-size:27px;font-weight:700;height:40px}
.auction .ns{color:#fff}
.auction .ew{opacity:.6}
.auction .q{display:inline-block;background:var(--brass-l);color:var(--ink);border-radius:8px;padding:0 12px}
.bottom{flex:1;background:var(--ivory);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;border-radius:18px 18px 0 0}
#tCoach{flex:1;min-height:0}
.controls{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;gap:8px}
.crow .btn{flex:1;min-height:62px;padding:0 6px}
.bb{font-size:30px}
.bb.sel{background:var(--baize);color:#fff;box-shadow:0 4px 0 var(--baize-d)}
.bb.glow{box-shadow:0 0 0 4px var(--brass),0 0 14px 2px rgba(195,154,74,.8)}
.pass{background:#e6efe9;box-shadow:inset 0 0 0 2px #b9d1c3,0 3px 0 #b9d1c3}

/* overlay */
.overlay{position:absolute;inset:0;background:rgba(20,30,25,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:30px}
.overlay.on{display:flex}
.modal{background:var(--paper);border-radius:22px;padding:34px 36px 30px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h2{font-family:'Playfair Display',Georgia,serif;font-size:40px;color:var(--baize-d);margin-bottom:14px;line-height:1.15}
.modal p{font-size:25px;line-height:1.5;margin-bottom:14px}
.modal .stack{margin-top:22px}
.cheat{font-size:21px;line-height:1.38}
.cheat h4{font-size:22px;font-weight:800;color:var(--brass-d);margin:12px 0 4px}
.cheat div{margin-left:4px}

.modeRow{display:flex;gap:14px;margin-top:12px}
.modeRow .btn{flex:1;min-height:76px;font-size:26px;border-radius:18px;padding:0 10px}
.btn.green{background:var(--baize);color:#fff;box-shadow:0 4px 0 var(--baize-d)}
.tBar .sc{color:var(--brass-l)}
#scrCh{padding:24px 34px}
#scrCh h2{font-family:'Playfair Display',Georgia,serif;font-size:44px;color:var(--baize-d);line-height:1.1}
#scrCh .sub{font-size:24px;color:var(--muted);margin:8px 0 18px;line-height:1.4}
.lvlRow{display:flex;gap:12px;margin-bottom:16px}
.lvlRow .btn{flex:1;min-height:76px;font-size:25px;line-height:1.2}
.lvlRow .btn.l1{background:#fff}
.lvlRow .btn.l2{background:#d6e6c9;box-shadow:inset 0 0 0 2px #b9d1a8,0 3px 0 #b9d1a8}
.lvlRow .btn.on{box-shadow:0 0 0 4px var(--brass),0 3px 0 var(--brass-d)}
.dealList{display:flex;flex-direction:column;gap:10px}
.dealRow{display:flex;align-items:center;gap:16px;min-height:78px;text-align:left;padding:0 20px;font-size:25px}
.dealRow .did{font-weight:800;color:var(--brass-d);width:52px}
.dealRow .dt{flex:1}
.dealRow .ds{font-size:32px;width:40px;text-align:center}
.dealRow .ds.x{color:var(--soft);font-weight:800}
.dealRow .ds.s{color:#d9a21b}
.htxt{font-size:19px;line-height:1.3;font-weight:700;color:var(--ivory);text-align:left;letter-spacing:-.3px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <header>
    <button class="btn hb" id="homeBtn" aria-label="Home">⌂ Home</button>
    <div class="title">Bridge Made Easy</div>
    <button class="btn hb" id="helpBtn" aria-label="Bidding cheat sheet">?</button>
    <button class="btn hb" id="soundBtn" aria-label="Sound on or off">🔊</button>
  </header>

  <section id="scrHome" class="screen on">
    <div class="hero">
      <div class="suitrow">♠<span class="cH">♥</span><span class="cD">♦</span><span class="cC">♣</span></div>
      <h1>Learn to play bridge</h1>
      <p>Standard American bidding, taught one step at a time. Short lessons first, then practice hands with a coach at your side.</p>
    </div>
    <div id="lessonGrid"></div>
    <button id="practiceBtn" class="btn primary">Play a Practice Hand</button>
    <div class="modeRow"><button id="chBtn" class="btn brass">Declarer Challenges ★</button><button id="jpBtn" class="btn green">Just Play ♠</button></div>
    <div class="styleRow"><span>Bidding style:</span><button class="btn" id="sysBasic">Basic</button><button class="btn" id="sysModern">Modern</button></div>
    <div id="statsLine"></div>
  </section>

  <section id="scrCh" class="screen">
    <h2>Declarer Challenges</h2>
    <div class="sub">The bidding is done. Find the plan that makes the contract. Each deal teaches one idea.</div>
    <div class="lvlRow" id="lvlRow"></div>
    <div class="dealList" id="dealList"></div>
  </section>

  <section id="scrLesson" class="screen">
    <div class="lsKicker" id="lsKicker"></div>
    <h2 id="lsTitle"></h2>
    <div class="sheet" id="lsSheet"></div>
    <div class="dots" id="lsDots"></div>
    <div class="navRow"><button class="btn" id="lsBack">◀ Back</button><button class="btn primary" id="lsNext">Next ▶</button></div>
  </section>

  <section id="scrEx" class="screen">
    <div class="exHead"><span id="exTitle"></span><span id="exProg"></span></div>
    <div id="exBody" style="display:flex;flex-direction:column;flex:1">
      <div class="exPrompt" id="exPrompt"></div>
      <div id="exHandWrap" class="felt"><div class="handbox" id="exHand"></div></div>
      <div class="exAnswer" id="exAnswer"></div>
      <div class="coach" id="exFeedback" style="visibility:hidden"><div class="who">C</div><div class="ctxt"></div></div>
      <div class="navRow" id="exNextRow"><button class="btn primary" id="exNext" disabled>Next ▶</button></div>
    </div>
  </section>

  <section id="scrTable" class="screen">
    <div class="tBar" id="tBar"></div>
    <div class="seat"><div class="seatLabel" id="nLabel"></div><div class="handbox" id="nHand"></div></div>
    <div class="middle"><div class="side" id="wBox"></div><div class="center" id="center"></div><div class="side" id="eBox"></div></div>
    <div class="seat"><div class="handbox" id="sHand"></div><div class="seatLabel" id="sLabel"></div></div>
    <div class="bottom">
      <div class="coach" id="tCoach"><div class="who">C</div><div class="ctxt"></div></div>
      <div class="controls" id="tControls"></div>
    </div>
  </section>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
</div></div>

<script>
// ENGINE START
const SUITS=['C','D','H','S'];
const STRAINS=['C','D','H','S','N'];
const SYM={C:'♣',D:'♦',H:'♥',S:'♠',N:'NT'};
const SNAME={C:'clubs',D:'diamonds',H:'hearts',S:'spades',N:'no trump'};
const SEATS=['N','E','S','W'];
const SEATNAME={N:'North',E:'East',S:'South',W:'West'};
function rankStr(r){return r===14?'A':r===13?'K':r===12?'Q':r===11?'J':String(r);}
function nextSeat(s){return SEATS[(SEATS.indexOf(s)+1)%4];}
function partnerOf(s){return SEATS[(SEATS.indexOf(s)+2)%4];}
function isNS(s){return s==='N'||s==='S';}
function newDeck(){const d=[];for(const s of SUITS)for(let r=2;r<=14;r++)d.push({s,r});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dealHands(){const d=shuffle(newDeck());const h={};SEATS.forEach((s,i)=>{h[s]=d.slice(i*13,i*13+13);});return h;}
function hcp(h){let p=0;for(const c of h)if(c.r>10)p+=c.r-10;return p;}
function lens(h){const L={C:0,D:0,H:0,S:0};for(const c of h)L[c.s]++;return L;}
function lengthPts(h){const L=lens(h);let p=0;for(const s of SUITS)if(L[s]>4)p+=L[s]-4;return p;}
function totalPts(h){return hcp(h)+lengthPts(h);}
function isBalanced(h){const v=Object.values(lens(h)).sort((a,b)=>a-b);return v[0]>=2&&v[1]>=3;}
function supportPts(h,trump){const L=lens(h),four=L[trump]>=4;let p=hcp(h);for(const s of SUITS){if(s===trump)continue;if(L[s]===0)p+=four?5:3;else if(L[s]===1)p+=four?3:2;else if(L[s]===2)p+=1;}return p;}
function isMajor(s){return s==='H'||s==='S';}
function rankOf(s){return STRAINS.indexOf(s);}
function bidVal(b){return (+b[0]-1)*5+rankOf(b[1]);}
function bidText(b){if(b==='P')return 'Pass';return b[0]+(b[1]==='N'?'NT':SYM[b[1]]);}
function cardTxt(c){return rankStr(c.r)+SYM[c.s];}
function lastBid(a){for(let i=a.length-1;i>=0;i--)if(a[i].bid!=='P')return a[i].bid;return null;}
function isLegal(bid,a){if(bid==='P')return true;const lb=lastBid(a);return !lb||bidVal(bid)>bidVal(lb);}
function cheapestLevel(strain,after){for(let l=1;l<=7;l++){if(!after||bidVal(l+strain)>bidVal(after))return l;}return 8;}
function auctionOver(a){if(a.length<3)return false;if(!a.slice(-3).every(x=>x.bid==='P'))return false;return a.some(x=>x.bid!=='P')||a.length>=4;}
function getContract(a){const lb=lastBid(a);if(!lb)return null;let idx=-1;for(let i=a.length-1;i>=0;i--)if(a[i].bid!=='P'){idx=i;break;}
  const side=a[idx].seat,strain=lb[1];let decl=side;
  for(const x of a){if(x.bid!=='P'&&x.bid[1]===strain&&(x.seat===side||x.seat===partnerOf(side))){decl=x.seat;break;}}
  return {level:+lb[0],strain,declarer:decl,bid:lb};}

const SYS={modern:false};
function topHonors(h,s){return h.filter(c=>c.s===s&&c.r>=11).length;}
function R(bid,why,means){return {bid,why,means:means||''};}
const PASS_DONE=()=>R('P','Your side has reached its contract. Pass.','Pass');

function recommend(auction,seat,hand){
  if(!isNS(seat))return R('P','The opponents stay quiet in practice hands.','Pass');
  const ns=auction.filter(x=>isNS(x.seat));
  const fi=ns.findIndex(x=>x.bid!=='P');
  let r;
  if(fi<0) r=openingBid(hand);
  else{
    const seq=ns.slice(fi).filter(x=>x.bid!=='P').map(x=>x.bid);
    const role=ns[fi].seat===seat?'O':'R';
    r=conventionReply(auction,seat,hand)||askerPlace(auction,seat,hand)||continueBid(seq,role,hand);
  }
  if(!isLegal(r.bid,auction)) r=R('P','There is no sensible higher bid to make, so pass.','Pass');
  return r;
}

/* ---- Blackwood, Gerber and quantitative 4NT (the robot partner answers; the asker places the contract) ---- */
function aceCount(h){return h.filter(c=>c.r===14).length;}
function kingCount(h){return h.filter(c=>c.r===13).length;}
function naturalSuitBid(ns,i){
  const b=ns[i].bid;if(b==='P'||b[1]==='N')return false;
  const prev=ns.slice(0,i).filter(x=>x.bid!=='P').map(x=>x.bid);
  if(b==='2C'&&(prev[prev.length-1]==='1N'||prev[prev.length-1]==='2N'))return false; // Stayman
  if(b==='2C'&&prev.length===0)return false;                                          // strong 2C
  if(b==='2D'&&(prev[prev.length-1]==='2C'))return false;                              // Stayman / waiting answers
  if(SYS.modern){const p1=prev[prev.length-1],p2=prev[prev.length-2];
    if(p1==='1N'&&(b==='2D'||b==='2H'))return false; if(p1==='2N'&&(b==='3D'||b==='3H'))return false;
    if(p2==='1N'&&((p1==='2D'&&b==='2H')||(p1==='2H'&&b==='2S')))return false;
    if(p2==='2N'&&((p1==='3D'&&b==='3H')||(p1==='3H'&&b==='3S')))return false;}
  return true;
}
function conventionReply(auction,seat,hand){
  const ns=auction.filter(x=>isNS(x.seat)&&x.bid!=='P');
  if(!ns.length)return null;
  const last=ns[ns.length-1];
  if(last.seat===seat)return null;            // partner must have made the last bid
  const lb=lastBid(auction);if(lb!==last.bid)return null;
  const prevMine=ns.slice(0,-1).filter(x=>x.seat===seat);const myLast=prevMine[prevMine.length-1];
  // find an earlier ask by partner that I've already answered
  let askIdx=-1,askType=null;
  for(let i=0;i<ns.length-1;i++){const x=ns[i];if(x.seat===seat)continue;
    if(x.bid==='4N'&&ns.slice(0,i).some((_,j)=>naturalSuitBid(ns,j))){askIdx=i;askType='BW';}
    const before=ns.slice(0,i).filter(y=>y.seat===seat);const bl=before[before.length-1];
    if(x.bid==='4C'&&bl&&bl.bid[1]==='N'&&+bl.bid[0]<=3&&ns[i-1]&&ns[i-1].seat===seat){askIdx=i;askType='G';}}
  const ACE=['0 or 4 aces','1 ace','2 aces','3 aces'],KING=['0 or 4 kings','1 king','2 kings','3 kings'];
  const a=aceCount(hand)%4,k=kingCount(hand)%4;
  if(askIdx>=0){
    if(askType==='BW'&&last.bid==='5N'){const b='6'+['C','D','H','S'][k];return R(b,`Partner's 5NT asks for kings. You have ${kingCount(hand)}, so answer ${bidText(b)}.`,`${KING[k]} (answering 5NT)`);}
    if(askType==='G'&&last.bid==='5C'){const b=['5D','5H','5S','5N'][k];return R(b,`Partner's 5♣ asks for kings. You have ${kingCount(hand)}, so answer ${bidText(b)}.`,`${KING[k]} (answering Gerber)`);}
    return R('P','Partner asked for aces and has now chosen the contract. Pass.','Pass');
  }
  if(last.bid==='4N'){
    const suitBid=ns.slice(0,-1).some((_,j)=>naturalSuitBid(ns,j));
    if(suitBid){const b='5'+['C','D','H','S'][a];return R(b,`Partner's 4NT is Blackwood, asking for aces. You have ${aceCount(hand)}, so answer ${bidText(b)}.`,`${ACE[a]} (answering Blackwood)`);}
    if(myLast&&myLast.bid[1]==='N'){
      const H=hcp(hand),top=myLast.bid==='1N'?16:myLast.bid==='2N'?(ns[0].seat===seat&&ns[0].bid==='2N'?21:19):99;
      if(H>=top)return R('6N',`Partner's 4NT invites a slam in no trump. With ${H} points, the top of your range, accept: 6NT.`,'Accepts the slam invitation');
      return R('P',`Partner's 4NT invites a slam in no trump. You're not at the top of your range, so pass.`,'Declines the slam invitation');
    }
  }
  if(last.bid==='4C'&&myLast&&myLast.bid[1]==='N'&&+myLast.bid[0]<=3&&ns[ns.length-2]===myLast){
    const b=['4D','4H','4S','4N'][a];return R(b,`Partner's 4♣ over your notrump is Gerber, asking for aces. You have ${aceCount(hand)}, so answer ${bidText(b)}.`,`${ACE[a]} (answering Gerber)`);
  }
  return null;
}
function askerPlace(auction,seat,hand){
  const ns=auction.filter(x=>isNS(x.seat)&&x.bid!=='P');if(ns.length<2)return null;
  const last=ns[ns.length-1],ask=ns[ns.length-2];
  if(last.seat===seat||ask.seat!==seat||ask.bid!=='4N'||lastBid(auction)!==last.bid)return null;
  if(!['5C','5D','5H','5S'].includes(last.bid)||!ns.slice(0,-2).some((_,j)=>naturalSuitBid(ns,j)))return null;
  const mine=aceCount(hand);let theirs=['C','D','H','S'].indexOf(last.bid[1]);if(theirs===0&&mine===0)theirs=4;
  const missing=4-mine-theirs,L=lens(hand);
  const suits=[...new Set(ns.filter((x,j)=>x.seat!==seat&&naturalSuitBid(ns,j)).map(x=>x.bid[1]))];
  const first=ns.find((x,j)=>x.seat!==seat&&naturalSuitBid(ns,j));
  let st=(first&&isMajor(first.bid[1])&&L[first.bid[1]]>=3)?first.bid[1]:(suits.filter(s=>isMajor(s)&&L[s]>=3).sort((a,b)=>L[b]-L[a])[0]||suits.filter(s=>L[s]>=3).sort((a,b)=>L[b]-L[a])[0]||'N');
  if(missing>=2){const b='5'+st;return bidVal(b)>bidVal(last.bid)?R(b,`Your side is missing ${missing} Aces, so slam is too risky. Stop at ${bidText(b)}.`,'Sign-off'):R('P',`Your side is missing ${missing} Aces. Stop here.`,'Sign-off');}
  const b='6'+st;
  return R(b,`Your side has ${4-missing} of the 4 Aces${missing?', missing just one':''}. Bid the slam: ${bidText(b)}.`,'Slam');
}
function continueBid(seq,role,h){
  const o=seq[0];
  if(seq.length>=6) return PASS_DONE();
  if(o==='1N') return nt1(seq,role,h);
  if(o==='2N') return nt2(seq,role,h);
  if(o==='2C') return strong2c(seq,role,h);
  if(SYS.modern&&(o==='2D'||o==='2H'||o==='2S')) return weak2(seq,role,h);
  return suit1(seq,role,h);
}
function openingSuit(L){
  const five=SUITS.filter(s=>L[s]>=5);
  if(five.length){let b=five[0];for(const s of five)if(L[s]>L[b]||(L[s]===L[b]&&rankOf(s)>rankOf(b)))b=s;return b;}
  if(L.D>L.C)return 'D';if(L.C>L.D)return 'C';return L.D>=4?'D':'C';
}
function openingBid(h){
  const H=hcp(h),T=totalPts(h),L=lens(h),bal=isBalanced(h);
  if(bal&&H>=20&&H<=21) return R('2N',`You have ${H} high-card points and a balanced hand. Open 2NT, which shows 20–21 balanced.`,'20–21 points, balanced');
  if(T>=22) return R('2C',`You have ${T} total points, a very strong hand. Open 2♣, the special bid for 22 or more points.`,'22+ points, very strong (artificial)');
  if(bal&&H>=15&&H<=17) return R('1N',`You have ${H} high-card points and a balanced hand. Open 1NT, which shows exactly 15–17 balanced.`,'15–17 points, balanced');
  if(SYS.modern&&T<13){
    const ws=['S','H','D'].find(s=>L[s]===6&&H>=5&&H<=10&&topHonors(h,s)>=2);
    if(ws) return R('2'+ws,`You have ${H} high-card points and six good ${SNAME[ws]}. That's a weak two-bid: open 2${SYM[ws]}.`,`Weak two: 5–10 points, 6 ${SNAME[ws]}`);
  }
  if(T<13) return R('P',`You have ${T} total points. You need 13 to open, so pass.`,'Fewer than 13 points');
  const s=openingSuit(L);let why;
  if(isMajor(s)) why=`You have ${T} total points and ${L[s]} ${SNAME[s]}. With 13+ points and a 5-card major, open 1${SYM[s]}.`;
  else if(L[s]>=5) why=`You have ${T} total points, and ${SNAME[s]} is your longest suit. Open 1${SYM[s]}.`;
  else why=`You have ${T} total points but no 5-card major, so open your longer minor: 1${SYM[s]}.`+(L.C===L.D?(L.C===3?' With 3–3 in the minors, choose clubs.':' With 4–4 in the minors, choose diamonds.'):'');
  return R('1'+s,why,isMajor(s)?`13+ points, 5+ ${SNAME[s]}`:`13+ points, 3+ ${SNAME[s]}`);
}

function weak2(seq,role,h){
  const k=seq.length,o=seq[0][1],H=hcp(h),L=lens(h);
  if(role==='R'&&k===1){
    if(isMajor(o)&&L[o]>=3){
      if(H>=15) return R('4'+o,`Partner's weak 2${SYM[o]} shows six ${SNAME[o]} and 5–10 points. With ${L[o]}-card support and ${H} points, there's enough for game: 4${SYM[o]}.`,'To play in game');
      if(H<=10) return R('3'+o,`Partner's weak two shows six ${SNAME[o]}. With ${L[o]}-card support but a weak hand, raise to 3${SYM[o]} to make life hard for the opponents. It doesn't invite game.`,'Blocking raise, not inviting');
    }
    if(H>=17&&isBalanced(h)) return R('3N',`Partner's weak two shows 5–10 points. With ${H} and a balanced hand, try 3NT.`,'To play');
    return R('P',`Partner's weak two shows a weak hand with six ${SNAME[o]}. Game is unlikely, so pass.`,'Pass');
  }
  return PASS_DONE();
}
function suit1(seq,role,h){
  const k=seq.length,o1=seq[0][1];
  if(role==='R'&&k===1) return respond1(h,o1);
  if(role==='O'&&k===2) return rebid1(h,o1,seq[1]);
  if(role==='R'&&k===3) return resp2(h,o1,seq[1],seq[2]);
  if(role==='O'&&k===4) return opener3(h,o1,seq[1],seq[2],seq[3]);
  return PASS_DONE();
}
function ntResp(H,bal){
  if(H<=10) return R('1N',`You have ${H} points and no suit you can show at the one level. Bid 1NT, which shows 6–10 points.`,'6–10 points, no fit');
  if(H<=12) return R('2N',`You have ${H} points${bal?' and a balanced hand':''} with no major-suit fit or new suit to show. Bid 2NT: 11–12 points, inviting game.`,'11–12 points (invites game)');
  return R('3N',`You have ${H} points. With partner's 13+, that's at least 26 together. Bid 3NT, a game.`,'13–15 points, balanced');
}
function respond1(h,o){
  const H=hcp(h),L=lens(h),bal=isBalanced(h),ob='1'+SYM[o];
  if(isMajor(o)&&L[o]>=3){
    const sp=supportPts(h,o);
    if(sp>=6){
      if(L[o]>=5&&H<=9&&Object.values(L).some(x=>x<=1)) return R('4'+o,`You have ${L[o]} ${SNAME[o]}, a singleton or void, and only ${H} high-card points. Jump to 4${SYM[o]}. This is a weak, blocking raise that makes life hard for the opponents. Partner will pass.`,`Weak hand, 5+ ${SNAME[o]} (pre-emptive)`);
      if(sp<=9) return R('2'+o,`Partner opened ${ob} and you have ${L[o]} of them: a fit! You have ${sp} support points (high cards plus shortness), so raise to 2${SYM[o]}.`,`6–9 points, 3+ ${SNAME[o]}`);
      if(sp<=12) return R('3'+o,`You have ${L[o]}-card support and ${sp} support points. With 10–12, raise to 3${SYM[o]}. Partner will bid game with more than a minimum.`,`10–12 points, 3+ ${SNAME[o]} (invites game)`);
      const ns=tempSuit(L,o);
      return R(ns,`You have ${L[o]}-card support and ${sp} support points: enough for game, and maybe a slam. Don't jump straight to 4${SYM[o]}, which would tell partner you're weak. Bid a new suit first, ${bidText(ns)}. It's forcing, so partner must bid again, and on your next turn you'll show your support for partner's ${SNAME[o]}.`,`${ns[0]==='1'?'6':'10'}+ points, forcing`);
    }
  }
  if(H<6) return R('P',`You have only ${H} high-card points. With fewer than 6, pass partner's opening.`,'Fewer than 6 points');
  const avail=['H','S'].filter(s=>rankOf(s)>rankOf(o)&&L[s]>=4);
  if(avail.length){
    let s=avail[0];
    if(avail.length===2){s=L.S>L.H?'S':(L.H>L.S?'H':(L.S>=5?'S':'H'));}
    return R('1'+s,`You have ${H} points and ${L[s]} ${SNAME[s]}. Show a 4-card or longer major at the one level: 1${SYM[s]}.`+(avail.length===2&&L.H===4&&L.S===4?' With four of each major, bid hearts first.':'')+' A new suit is forcing, so partner will bid again.',`6+ points, 4+ ${SNAME[s]}`);
  }
  if(o==='C'&&L.D>=4) return R('1D',`You have ${H} points and ${L.D} diamonds, with no 4-card major. Bid 1♦. A new suit at the one level shows 6+ points and is forcing.`,'6+ points, 4+ diamonds');
  if(bal) return ntResp(H,true);
  if(H>=10){
    const c=SUITS.filter(s=>rankOf(s)<rankOf(o)&&L[s]>=(s==='H'?5:4));
    if(c.length){let s=c[0];for(const x of c)if(L[x]>L[s]||(L[x]===L[s]&&rankOf(x)>rankOf(s)))s=x;
      return R('2'+s,`You have ${H} points and ${L[s]} ${SNAME[s]}. A new suit at the two level needs 10+ points, so bid 2${SYM[s]}. It's forcing: partner will bid again.`,`10+ points, ${s==='H'?'5':'4'}+ ${SNAME[s]}`);}
  }
  if(!isMajor(o)&&L[o]>=5){
    if(H<=10) return R('2'+o,`You have ${H} points and ${L[o]} ${SNAME[o]}, good support for partner's suit. Raise to 2${SYM[o]}.`,`6–10 points, 5+ ${SNAME[o]}`);
    if(H<=12) return R('3'+o,`You have ${H} points and ${L[o]}-card ${SNAME[o]} support. With 11–12, jump to 3${SYM[o]} to invite game.`,`11–12 points, 5+ ${SNAME[o]}`);
  }
  return ntResp(H,false);
}
function tempSuit(L,o){
  if(o==='H'&&L.S>=4)return '1S';
  const c=SUITS.filter(s=>rankOf(s)<rankOf(o)&&L[s]>=(s==='H'?5:4));
  if(c.length){let b=c[0];for(const x of c)if(L[x]>L[b]||(L[x]===L[b]&&rankOf(x)>rankOf(b)))b=x;return '2'+b;}
  const m=['D','C'].filter(s=>rankOf(s)<rankOf(o));let b=m[0];for(const x of m)if(L[x]>L[b])b=x;return '2'+b;
}
function secondSuit(L,o1,rs,higher){
  const c=SUITS.filter(s=>s!==o1&&s!==rs&&L[s]>=4&&(higher?rankOf(s)>rankOf(o1):rankOf(s)<rankOf(o1)));
  if(!c.length)return null;let b=c[0];for(const s of c)if(L[s]>L[b]||(L[s]===L[b]&&rankOf(s)>rankOf(b)))b=s;return b;
}
function rebid1(h,o1,r1){
  const H=hcp(h),T=totalPts(h),L=lens(h),bal=isBalanced(h);
  const rl=+r1[0],rs=r1[1];
  if(rs===o1){
    if(rl===2){
      if(isMajor(o1)){
        if(T<=15) return R('P',`Partner raised to ${bidText(r1)}, showing 6–9 points. With your ${T}, game is unlikely. Pass.`,'Minimum, passes');
        if(T<=18) return R('3'+o1,`Partner has 6–9 points and you have ${T}. Game is possible, so invite with 3${SYM[o1]}. Partner bids game with the top of their range.`,'16–18 points, invites game');
        return R('4'+o1,`You have ${T} points and partner has at least 6. That's enough for game: bid 4${SYM[o1]}.`,'19+ points, game');
      }
      if(T>=18) return R('3N',`Partner showed 6–10 points with ${SNAME[o1]} support. With your ${T} points, bid 3NT.`,'Enough for game');
      return R('P',`Partner showed 6–10 points. With ${T}, game is unlikely, so pass.`,'Passes');
    }
    if(rl===3){
      const acc=isMajor(o1)?'4'+o1:'3N';
      if(T>=14) return R(acc,`Partner's ${bidText(r1)} shows 10–12 points. You have ${T}, more than a bare minimum, so accept: ${bidText(acc)}.`,'Accepts the invitation');
      return R('P',`Partner's ${bidText(r1)} invites game. With a bare minimum of ${T} points, decline by passing.`,'Minimum, declines');
    }
    return R('P','Partner bid game. Pass.','Pass');
  }
  if(r1==='1N'){
    if(bal){
      if(H>=18) return R('2N',`Partner shows 6–10. With your ${H} points and a balanced hand, invite game with 2NT.`,'18–19 points, balanced');
      return R('P',`Partner's 1NT shows 6–10 points. Your hand is balanced and game is unlikely, so pass.`,'Passes');
    }
    if(L[o1]>=6){
      if(T>=19&&isMajor(o1)) return R('4'+o1,`You have ${T} points and a ${L[o1]}-card suit. Bid game in it: 4${SYM[o1]}.`,'19+ points, long suit');
      if(T>=16) return R('3'+o1,`You have ${T} points and ${L[o1]} ${SNAME[o1]}. Jump to 3${SYM[o1]} to show extra strength and a long suit.`,`16–18 points, 6+ ${SNAME[o1]}`);
      return R('2'+o1,`You have a minimum opening with ${L[o1]} ${SNAME[o1]}. Rebid your suit at the two level: 2${SYM[o1]}.`,`13–15 points, 6+ ${SNAME[o1]}`);
    }
    if(T>=19) return R('3N',`You have ${T} points and partner has 6–10, enough for game. Bid 3NT.`,'19+ points');
    const s2=secondSuit(L,o1,null,false);
    if(s2) return R('2'+s2,`Show your second suit: 2${SYM[s2]}. Partner can choose between your two suits.`,`4+ ${SNAME[s2]}`);
    return R('2'+o1,`Rebid your suit at the two level: 2${SYM[o1]}.`,`Minimum, ${SNAME[o1]}`);
  }
  if(r1==='2N'){
    if(T>=14) return R('3N',`Partner's 2NT shows 11–12 points. With ${T}, you have enough for game. Bid 3NT.`,'Accepts');
    return R('P','Partner invited game with 2NT. With a bare minimum, pass.','Declines');
  }
  if(r1==='3N') return R('P','Partner bid game. Pass.','Pass');
  if(rl===1){
    if(isMajor(rs)&&L[rs]>=4){
      if(T<=15) return R('2'+rs,`Partner bid ${bidText(r1)} and you have four ${SNAME[rs]}: a fit! With a minimum (${T} points), raise to 2${SYM[rs]}.`,`13–15 points, 4 ${SNAME[rs]}`);
      if(T<=18) return R('3'+rs,`You have four ${SNAME[rs]} and ${T} points. Jump to 3${SYM[rs]} to show extra values.`,`16–18 points, 4 ${SNAME[rs]}`);
      return R('4'+rs,`You have four ${SNAME[rs]} and ${T} points, enough for game. Bid 4${SYM[rs]}.`,`19+ points, 4 ${SNAME[rs]}`);
    }
    const up=['H','S'].filter(s=>s!==o1&&rankOf(s)>rankOf(rs)&&L[s]>=4);
    if(up.length){const s=up[0];return R('1'+s,`Show your four ${SNAME[s]} at the one level: 1${SYM[s]}. Partner may have four too.`,`4+ ${SNAME[s]}`);}
    if(bal){
      if(H>=18) return R('2N',`You have ${H} points and a balanced hand. Jump to 2NT to show 18–19.`,'18–19 points, balanced');
      return R('1N',`Your hand is balanced with ${H} points. Rebid 1NT to show a minimum balanced opening (12–14).`,'12–14 points, balanced');
    }
    if(L[o1]>=6){
      if(T>=19) return isMajor(o1)?R('4'+o1,`You have ${T} points and a long suit. Bid game: 4${SYM[o1]}.`,'19+ points'):R('3N',`You have ${T} points. Bid game in 3NT.`,'19+ points');
      if(T>=16) return R('3'+o1,`Jump to 3${SYM[o1]} to show ${L[o1]} ${SNAME[o1]} and 16–18 points.`,`16–18 points, 6+ ${SNAME[o1]}`);
      return R('2'+o1,`Rebid your long suit at the two level: 2${SYM[o1]}, showing a minimum with 6+ cards.`,`13–15 points, 6+ ${SNAME[o1]}`);
    }
    const s2=secondSuit(L,o1,rs,false);
    if(s2) return R('2'+s2,`Show your second suit: 2${SYM[s2]}.`,`4+ ${SNAME[s2]}`);
    if(rs==='D'&&L.D>=4) return R(T>=16?'3D':'2D',`You have four diamonds, so support partner's suit: ${T>=16?'3♦':'2♦'}.`,'Diamond support');
    if(T>=17){const s3=secondSuit(L,o1,rs,true);if(s3) return R('2'+s3,`With ${T} points you can show a higher second suit at the two level (called a "reverse"): 2${SYM[s3]}.`,`17+ points, 4+ ${SNAME[s3]}`);}
    if(L[o1]>=5) return R('2'+o1,`Rebid your 5-card suit: 2${SYM[o1]}.`,`Minimum, 5+ ${SNAME[o1]}`);
    return R('1N','With nothing else to show, rebid 1NT.','Minimum');
  }
  if(rl===2){

/* ---- card play ---- */
function cardEq(a,b){return a.s===b.s&&a.r===b.r;}
const SUIT_ORDER={N:'SHCD',S:'SHCD',H:'HSDC',D:'DSHC',C:'CHSD'};
function sortHand(h,trump){const ord=SUIT_ORDER[trump||'N'];return h.slice().sort((a,b)=>ord.indexOf(a.s)-ord.indexOf(b.s)||b.r-a.r);}
function newPlay(hands,contract){
  const lead=nextSeat(contract.declarer);
  return {hands:{N:hands.N.slice(),E:hands.E.slice(),S:hands.S.slice(),W:hands.W.slice()},trump:contract.strain==='N'?null:contract.strain,
    trick:[],leader:lead,turn:lead,tricks:{NS:0,EW:0},played:[],history:[],firstLeadSuit:null,done:false};

function playCard(st,seat,card){
  st.hands[seat]=st.hands[seat].filter(c=>!cardEq(c,card));
  st.trick.push({seat,card});st.played.push(card);
  if(!st.history.length&&st.trick.length===1)st.firstLeadSuit=card.s;
  if(st.trick.length<4)st.turn=nextSeat(seat);
}
function finishTrick(st){
  const w=trickWinner(st.trick,st.trump);
  if(isNS(w.seat))st.tricks.NS++;else st.tricks.EW++;
  st.history.push({cards:st.trick,winner:w.seat});st.trick=[];st.leader=w.seat;st.turn=w.seat;
  if(st.history.length===13)st.done=true;return w;

function isMaster(card,st,own){
  for(let r=card.r+1;r<=14;r++){
    if(st.played.some(c=>c.s===card.s&&c.r===r))continue;
    if(own.some(h=>h.some(c=>c.s===card.s&&c.r===r)))continue;
    return false;

}
function lowest(cs){return cs.reduce((a,b)=>b.r<a.r?b:a);}
function highest(cs){return cs.reduce((a,b)=>b.r>a.r?b:a);}

  const by=bySuit(h);

  let best=null;

  if(best)return best;
  let pool=suits;
  if(trump){const ok=suits.filter(s=>!(by[s][0].r===14&&by[s].length>1));if(ok.length)pool=ok;}
  let ls=pool[0];for(const s of pool)if(by[s].length>by[ls].length||(by[s].length===by[ls].length&&hcp(by[s])>hcp(by[ls])))ls=s;
  const c=by[ls];if(c.length>=4)return c[3];if(c.length===2)return c[0];return c[c.length-1];
}
function followChoose(st,seat,isDef){
  const legal=legalCards(st,seat),trump=st.trump,ls=st.trick[0].card.s;
  const w=trickWinner(st.trick,trump),partnerWin=w.seat===partnerOf(seat);
  const canFollow=st.hands[seat].some(c=>c.s===ls);
  const beats=c=>trickWinner(st.trick.concat([{seat,card:c}]),trump).seat===seat;
  const pos=st.trick.length;
  if(canFollow){
    if(partnerWin)return {card:lowest(legal),why:'partner'};
    if(pos===1){
      const led=st.trick[0];
      if(isDef&&led.card.r>=11&&isNS(led.seat)){
        const touching=led.seat==='N'&&st.hands.N.some(c=>c.s===led.card.s&&c.r===led.card.r-1);
        const cov=legal.filter(beats);
        if(!touching&&cov.length)return {card:lowest(cov),why:'cover'};
      }
      return {card:lowest(legal),why:'second'};
    }
    const win=legal.filter(beats);
    if(win.length){
      if(pos===2&&!isDef){const own=[st.hands.N,st.hands.S];const sure=win.filter(c=>isMaster(c,st,own));if(sure.length)return {card:lowest(sure),why:'win'};}

  const trumps=trump?legal.filter(c=>c.s===trump):[];

function defenderChoose(st,seat){
  if(!st.trick.length)return st.history.length?defLead(st,seat):openingLead(st.hands[seat],st.trump);

}
function outstandingTrumps(st){if(!st.trump)return 0;let n=13;n-=st.played.filter(c=>c.s===st.trump).length;n-=st.hands.N.filter(c=>c.s===st.trump).length+st.hands.S.filter(c=>c.s===st.trump).length;return n;}
const FOLLOW_WHY={
  cover:c=>`Cover an honor with an honor: ${cardTxt(c)}.`,
  partner:c=>`Your side is already winning this trick, so play low (${cardTxt(c)}) and save your high cards.`,
  second:c=>`Second hand low: play your lowest ${SNAME[c.s].slice(0,-1)} (${cardTxt(c)}) and keep your high cards for later.`,
  win:c=>`You can win this trick. Do it as cheaply as possible: ${cardTxt(c)}.`,
  cant:c=>`You can't win this trick, so play your lowest card: ${cardTxt(c)}.`,
  ruff:c=>`You're out of this suit, so trump it with ${cardTxt(c)}!`,
  discard:c=>`You can't follow suit, so discard a low card you won't need: ${cardTxt(c)}.`

function declarerHint(st,seat){
  const own=[st.hands.N,st.hands.S],h=st.hands[seat],pt=st.hands[partnerOf(seat)],trump=st.trump;
  if(st.trick.length){const f=followChoose(st,seat);return {card:f.card,why:FOLLOW_WHY[f.why](f.card),kind:f.why};}
  if(trump){
    const out=outstandingTrumps(st),myT=h.filter(c=>c.s===trump);

      const mt=myT.filter(c=>isMaster(c,st,own));

      return {card:c,why:pt.some(x=>x.s===trump&&isMaster(x,st,own))?`Draw trumps: lead a low trump (${cardTxt(c)}) over to partner's high trump.`:`Draw trumps: the opponents still hold ${out}. Lead ${cardTxt(c)} to start pulling them out.`};
    }
  }

  for(const s of SUITS){
    if(s===trump)continue;
    const mine=h.filter(c=>c.s===s),his=pt.filter(c=>c.s===s);if(!mine.length)continue;
    const myM=mine.filter(c=>isMaster(c,st,own)),hisM=his.filter(c=>isMaster(c,st,own));
    let cand=null;
    if(myM.length&&(mine.length<=his.length||!hisM.length))cand={card:highest(myM),score:mine.length<=his.length?3:2.8,why:`Cash a sure winner: ${cardTxt(highest(myM))}.`+(mine.length<=his.length&&his.length?' Play high from the short side first.':'')};
    else if(hisM.length)cand={card:lowest(mine),score:2.5,why:`Lead a low ${SNAME[s].slice(0,-1)} (${cardTxt(lowest(mine))}) over to partner's winner. High from the short side first.`};
    if(cand&&(!best||cand.score>best.score))best=cand;

}
function sureWinners(N,S){let t=0;for(const s of SUITS){const a=N.filter(c=>c.s===s),b=S.filter(c=>c.s===s),all=a.concat(b);let n=0;for(let r=14;r>=2;r--){if(all.some(c=>c.r===r))n++;else break;}t+=Math.min(n,Math.max(a.length,b.length));}return t;}

function makePracticeDeal(minNS,maxNS){

    h=dealHands();let ns=hcp(h.N)+hcp(h.S),ew=hcp(h.E)+hcp(h.W);

}
function catOpen(b){if(b==='P')return 'P';if(b==='1N')return '1N';if(b==='2N'||b==='2C')return 'big';if(b[0]==='2')return 'weak2';return isMajor(b[1])?'1M':'1m';}
function genOpeningEx(cat){let last;for(let i=0;i<40000;i++){const h=dealHands().S;const r=openingBid(h);last={hand:h,ans:r};if(catOpen(r.bid)===cat)return last;}return last;}
function catResp(o,b){if(b==='P')return 'P';if(b[1]===o[1])return 'raise';if(b==='1N')return '1N';if(b[1]==='N')return 'NT';return b[0]==='1'?'new1':'new2';}
function genRespondEx(cat){let last=null;for(let i=0;i<40000;i++){const d=dealHands();const o=openingBid(d.N).bid;if(!/^1[CDHS]$/.test(o))continue;const r=respond1(d.S,o[1]);last={opening:o,hand:d.S,ans:r};if(catResp(o,r.bid)===cat)return last;}return last;}

/* ---- double-dummy solver (used by challenge defenders near the end of a hand) ---- */
// Double-dummy solver. seats 0=N 1=E 2=S 3=W ; suits 0=C 1=D 2=H 3=S ; ranks bit 0..12 = 2..A ; trump -1 for NT
const DD=(()=>{
let TT=new Map(), nodes=0;
function key(h,leader){let k=leader+'';for(let s=0;s<4;s++)for(let u=0;u<4;u++)k+=','+h[s][u];return k;}
function search(h,trick,leader,trump,alpha,beta,cardsLeft){
  // returns NS tricks from here among remaining tricks (including current trick)
  nodes++;
  const nt=trick.length;
  if(nt===0){
    const rem=cardsLeft;            // remaining tricks
    if(rem===0)return 0;
    const k=key(h,leader);const e=TT.get(k);
    let lo=0,hi=rem;
    if(e){lo=e[0];hi=e[1];if(lo>=beta)return lo;if(hi<=alpha)return hi;if(lo===hi)return lo;alpha=Math.max(alpha,lo);beta=Math.min(beta,hi);}
    // quick upper/lower via top tricks? skip
    const a0=alpha,b0=beta;
    const v=searchMoves(h,trick,leader,leader,trump,alpha,beta,cardsLeft);
    let nlo=lo,nhi=hi;
    if(v<=a0)nhi=Math.min(nhi,v);else if(v>=b0)nlo=Math.max(nlo,v);else{nlo=v;nhi=v;}
    TT.set(k,[nlo,nhi]);
    return v;
  }
  const seat=(leader+nt)%4;
  return searchMoves(h,trick,leader,seat,trump,alpha,beta,cardsLeft);
}
function moves(h,seat,trick){
  const hand=h[seat];let suits=[0,1,2,3];
  if(trick.length){const ls=trick[0].u;if(hand[ls])suits=[ls];}
  // remaining cards (hands + in-trick) per suit
  const out=[];
  for(const u of suits){
    const m=hand[u];if(!m)continue;
    let all=h[0][u]|h[1][u]|h[2][u]|h[3][u];for(const t of trick)if(t.u===u)all|=(1<<t.r);
    let inGroup=false;
    for(let r=12;r>=0;r--){
      const bit=1<<r;
      if(m&bit){if(!inGroup){out.push({u,r});inGroup=true;}}
      else if(all&bit)inGroup=false;
    }
  }
  return out;
}
function winnerOf(trick,trump){let w=0;for(let i=1;i<4;i++){const c=trick[i],b=trick[w];if(c.u===b.u){if(c.r>b.r)w=i;}else if(c.u===trump)w=i;}return w;}
function searchMoves(h,trick,leader,seat,trump,alpha,beta,cardsLeft){
  const ns=(seat%2===0);
  let ms=moves(h,seat,trick);
  // ordering: try high cards first when leading, else try winning low then low
  ms.sort((a,b)=>b.r-a.r);
  let best=ns?-1:99;
  for(const c of ms){
    h[seat][c.u]&=~(1<<c.r);trick.push({u:c.u,r:c.r,s:seat});
    let v;
    if(trick.length===4){
      const wi=winnerOf(trick,trump),ws=trick[wi].s,won=(ws%2===0)?1:0;
      const saved=trick.splice(0,4);
      v=won+search(h,[],ws,trump,alpha-won,beta-won,cardsLeft-1);
      trick.push(...saved);
    }else v=search(h,trick,leader,trump,alpha,beta,cardsLeft);
    trick.pop();h[seat][c.u]|=(1<<c.r);
    if(ns){if(v>best)best=v;if(best>alpha)alpha=best;}else{if(v<best)best=v;if(best<beta)beta=best;}
    if(alpha>=beta)break;
  }
  return best;
}
function solve(h,trick,leader,trump,cardsLeft){return search(h,trick,leader,trump,0,cardsLeft,cardsLeft);}
// value of each legal move for seat to play
function evalMoves(h,trick,leader,trump,cardsLeft){
  const seat=(leader+trick.length)%4;const res=[];
  for(const c of moves(h,seat,trick)){
    h[seat][c.u]&=~(1<<c.r);trick.push({u:c.u,r:c.r,s:seat});let v;
    if(trick.length===4){const wi=winnerOf(trick,trump),ws=trick[wi].s,won=(ws%2===0)?1:0;const saved=trick.splice(0,4);v=won+solve(h,[],ws,trump,cardsLeft-1);trick.push(...saved);}
    else v=solve(h,trick,leader,trump,cardsLeft);
    trick.pop();h[seat][c.u]|=(1<<c.r);res.push({u:c.u,r:c.r,v});
  }return res;
}
return {solve,evalMoves,reset:()=>{TT=new Map();},stats:()=>({nodes,tt:TT.size})};
})();


const DSI={C:0,D:1,H:2,S:3},DSE={N:0,E:1,S:2,W:3};
function parseCard(c){return {s:c[0],r:'23456789TJQKA'.indexOf(c[1])+2};}
function parseHandStr(str){const o=['S','H','D','C'],h=[];str.split('.').forEach((p,i)=>{for(const ch of p)h.push({s:o[i],r:'23456789TJQKA'.indexOf(ch)+2});});return h;}
function ddEvalSt(st){const h=[];for(const s of SEATS){const m=[0,0,0,0];for(const c of st.hands[s])m[DSI[c.s]]|=1<<(c.r-2);h[DSE[s]]=m;}
  const trick=st.trick.map(t=>({u:DSI[t.card.s],r:t.card.r-2,s:DSE[t.seat]}));const tr=st.trump?DSI[st.trump]:-1;
  const leader=DSE[st.trick.length?st.trick[0].seat:st.turn];
  return DD.evalMoves(h,trick,leader,tr,13-st.history.length).map(x=>({card:{s:SUITS[x.u],r:x.r+2},v:x.v}));}
function sameGroupSt(st,seat,a,b){if(a.s!==b.s)return false;const lo=Math.min(a.r,b.r),hi=Math.max(a.r,b.r);for(let r=lo+1;r<hi;r++){if(!st.hands[seat].some(c=>c.s===a.s&&c.r===r)&&!st.played.some(c=>c.s===a.s&&c.r===r))return false;}return true;}
function ddPick(st,seat,maximize,pref){const ev=ddEvalSt(st);const bv=maximize?Math.max(...ev.map(e=>e.v)):Math.min(...ev.map(e=>e.v));const best=ev.filter(e=>e.v===bv).map(e=>e.card);
  if(pref&&best.some(c=>c.s===pref.s&&(c.r===pref.r||sameGroupSt(st,seat,c,pref))))return pref;
  return best.reduce((a,b)=>b.r<a.r?b:a);}
function hybridDef(st,seat){const rb=defenderChoose(st,seat);if(13-st.history.length<=7)return ddPick(st,seat,false,rb);return rb;}

function describeBid(auction,seat,bid){
  const prev=[];auction.forEach((x,i)=>{if(x.seat===seat)prev.push(i);});
  const counts={};let hits=0;
  for(let t=0;t<7000&&hits<50;t++){
    const h=shuffle(newDeck()).slice(0,13);let ok=true;
    for(const i of prev)if(recommend(auction.slice(0,i),seat,h).bid!==auction[i].bid){ok=false;break;}
    if(!ok)continue;
    const r=recommend(auction,seat,h);if(r.bid!==bid)continue;
    hits++;counts[r.means]=(counts[r.means]||0)+1;
  }
  if(hits<4)return null;
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}

  {q:'Which bid is higher: 2♦ or 2♠?',opts:['2♦','2♠','They are equal'],a:1,why:'At the same level, suits rank ♣, ♦, ♥, ♠ from lowest to highest, so 2♠ is higher.'},
  {q:'How many tricks does a 3NT contract need?',opts:['3 tricks','7 tricks','9 tricks','10 tricks'],a:2,why:'6 + 3 = 9 tricks, with no trump suit.'},
  {q:'What is the "dummy"?',opts:['The player who leads first','Declarer\'s partner\'s hand, laid face-up','A card that can\'t win a trick','The lowest bid of the auction'],a:1,why:'After the opening lead, declarer\'s partner lays their hand face-up, and declarer plays it.'},
  {q:'Which of these is a game contract?',opts:['2♠','3♥','3NT','4♦'],a:2,why:'Game is 3NT, 4♥, 4♠, 5♣ or 5♦. Of these, only 3NT is a game.'}
 ]}},
 {title:'Counting your points',blurb:'How strong is your hand?',pages:[
  {h:'High-card points',t:`<p>Before you bid, count your hand's strength. Each high card is worth points:</p><p><b>Ace = 4 · King = 3 · Queen = 2 · Jack = 1</b></p><p>The whole deck holds 40 points, so an average hand has 10.</p>`,ex:`♠ A K 7 3 &nbsp; ♥ Q 8 5 &nbsp; ♦ J 9 4 &nbsp; ♣ 6 3 2<br>Ace 4 + King 3 + Queen 2 + Jack 1 = <b>10 points</b>`},
  {h:'Length points',t:`<p>Long suits win extra tricks, so they count too. Add 1 length point for every card beyond four in a suit. A 5-card suit adds 1, and a 6-card suit adds 2.</p><p>High-card points plus length points give your <b>total points</b> for opening the bidding.</p>`,ex:`♠ K Q 10 8 6 4 &nbsp; ♥ A 5 &nbsp; ♦ K 7 3 &nbsp; ♣ 9<br>12 high-card points + 2 for six spades = <b>14 total</b>`},
  {h:'Numbers to remember',t:`<p><b>13 points</b>: enough to open the bidding.</p><p><b>25 points</b> between you and your partner: usually enough for a game contract (3NT, 4♥ or 4♠).</p><p>You'll use these two numbers in almost every auction.</p>`}
 ],exercise:{type:'points',n:5}},
 {title:'Opening the bidding',blurb:'Your first bid',pages:[
  {h:'Do I open?',t:`<p>The first player to make a real bid "opens" the bidding. Count your total points.</p><p>With fewer than 13, say <b>Pass</b>. With 13 to 21, you'll open with a bid at the one level.</p>`},
  {h:'The 1NT opening',t:`<p>Open <b>1NT</b> with 15–17 high-card points and a balanced hand: no void, no singleton, and no more than one doubleton.</p><p>1NT is a wonderful bid. It tells partner your strength and shape in a single step.</p>`,ex:`♠ K Q 4 &nbsp; ♥ A J 7 2 &nbsp; ♦ K 10 5 &nbsp; ♣ Q 8 3<br>16 points, balanced: <b>open 1NT</b>`},
  {h:'Opening a major',t:`<p>Otherwise, open your longest suit. To open a major suit (♥ or ♠) you need at least <b>five</b> cards in it.</p><p>With two 5-card suits, open the higher-ranking one.</p>`,ex:`♠ A Q 9 6 3 &nbsp; ♥ K 4 &nbsp; ♦ Q J 8 &nbsp; ♣ 7 5 2<br>13 total points, five spades: <b>open 1♠</b>`},
  {h:'Opening a minor',t:`<p>With no 5-card major, open your longer minor suit, ♣ or ♦. It may have only three or four cards.</p><p>With three of each minor, open 1♣. With four of each, open 1♦.</p>`},
  {h:'Very strong hands',t:`<p>With 20–21 points and a balanced hand, open <b>2NT</b>.</p><p>With 22 or more points, open <b>2♣</b>. This is a special signal. It says "I'm very strong," not "I like clubs," and partner must keep bidding.</p><p>In the modern style, 2♦, 2♥ and 2♠ openings are weak. See Lesson 8.</p>`}
 ],exercise:{type:'open',cats:['1M','1m','1N','P','1M','big']}},
 {title:'Answering partner',blurb:'Responding to 1 of a suit',pages:[
  {h:'Should I respond?',t:`<p>When partner opens 1 of a suit, they have 13 or more points. If you have <b>6 or more</b>, you should bid. With fewer than 6, pass.</p><p>Your job now is to find a trump fit and decide how high to go.</p>`},
  {h:'Supporting a major',t:`<p>If partner opens 1♥ or 1♠ and you hold three or more cards in that suit, you've found a fit. Count <b>support points</b>: your high cards plus extra for short suits. With four trumps, add 5 for a void, 3 for a singleton, 1 for a doubleton. With only three trumps, add 3, 2 and 1.</p><p>6–9: raise to 2. &nbsp;10–12: raise to 3.</p><p>13 or more: bid a new suit first (partner must bid again), then jump to game in partner's suit next time. A <i>direct</i> jump to 4 shows a weak hand with five trumps.</p>`},
  {h:'Showing a new suit',t:`<p>No fit yet? Show a 4-card or longer major at the one level, with 6+ points. With four hearts and four spades, bid hearts first.</p><p>A new suit at the two level needs <b>10+ points</b>. Any new suit you bid is forcing: partner must bid again.</p>`},
  {h:'No-trump answers',t:`<p>With nothing else to say, bid no trump:</p><p><b>1NT</b> shows 6–10 points.<br><b>2NT</b> shows 11–12 and invites game.<br><b>3NT</b> shows 13–15, enough for game.</p>`}
 ],exercise:{type:'respond',cats:['raise','new1','1N','P','new2','raise']}},
 {title:'Answering 1NT',blurb:'Responding to partner\'s 1NT',pages:[
  {h:'You are the captain',t:`<p>Partner's 1NT shows 15–17 points and a balanced hand. Add your points to theirs: if you have at least 25 together, bid game.</p><p>Since you know so much about partner's hand, you get to steer the auction.</p>`},
  {h:'Weak hands',t:`<p>With <b>0–7 points</b>, game is out of reach. Pass.</p><p>But if you have a 5-card or longer suit other than clubs, bid 2 of it instead. Your long suit will play better than no trump, and partner will pass. (Modern players use transfers here instead; see Lesson 9.)</p>`},
  {h:'Invite or bid game',t:`<p><b>8–9 points:</b> bid 2NT to invite game. Partner bids 3NT with a maximum.</p><p><b>10–15 points:</b> bid 3NT.</p><p>With a 5-card major and 10+, bid 3 of it so partner can choose. With a 6-card major and 10+, bid game in it.</p>`},
  {h:'Stayman',t:`<p>With 8+ points and a 4-card major (but no 5-card major), bid <b>2♣</b>. This asks, "Do you have a 4-card major?"</p><p>Partner answers 2♥, 2♠, or 2♦ for "no." If you match, raise the major. If not, bid no trump.</p>`}
 ],exercise:{type:'nt',cats:['P','stay','3N','2N','sign','major']}},
 {title:'Playing the hand',blurb:'Declarer play basics',pages:[
  {h:'Make a plan',t:`<p>Before you play to the first trick, stop and plan. In no trump, count your sure winners: Aces, and other top cards that are sure to win.</p><p>If you need more, look for extra tricks in your longest suit.</p>`},
  {h:'Draw trumps',t:`<p>In a trump contract, lead trumps early, again and again, until the opponents have none left. That way they can't trump (ruff) your winners.</p><p>Then cash your winners in the other suits.</p>`},
  {h:'High from the short side',t:`<p>When one hand is shorter in a suit, play its high cards first.</p><p>That way you never get stuck in the wrong hand with winners you can't reach.</p>`,ex:`North: ♠ A K &nbsp; &nbsp; South: ♠ Q J 5 4<br>Play the ♠A and ♠K first, then the ♠Q and ♠J`},
  {h:'Finesses and defense',t:`<p>A <b>finesse</b> means leading toward a card you hope will win. With ♥A Q in dummy, lead a low heart from your hand. If West has the King, your Queen wins.</p><p>Defenders follow two old sayings: "second hand low" and "third hand high."</p>`}
 ],exercise:{type:'quiz',items:[
  {q:'Hearts are trump. The trick is ♠K, ♠A, ♥2, ♠Q. Which card wins?',opts:['♠K','♠A','♥2','♠Q'],a:2,why:'The ♥2 is a trump, and any trump beats every card of another suit.'},
  {q:'No trump. West leads ♦5, North plays ♦K, East plays ♦A, and South (out of diamonds) plays ♣A. Who wins?',opts:['West','North','East','South'],a:2,why:'With no trump suit, only diamonds can win. East\'s ♦A is the highest diamond.'},
  {q:'In a trump contract, what should declarer usually do early?',opts:['Cash every Ace first','Draw the opponents\' trumps','Save all trumps for the end','Lead from the shortest suit'],a:1,why:'Drawing trumps stops the opponents from ruffing your winners.'},
  {q:'North holds ♠A K and South holds ♠Q J 5 4. Which spades should you play first?',opts:['The ♠A and ♠K','The ♠Q and ♠J','A low spade from South','It doesn\'t matter'],a:0,why:'Play high cards from the short side first, so you don\'t get stuck in the wrong hand.'}
 ]}},
 {title:'Bidding slams',blurb:'Blackwood and Gerber',pages:[
  {h:'Thinking about slam',t:`<p>A <b>small slam</b> (6 of a suit or 6NT) needs 12 tricks. A <b>grand slam</b> (7) needs all 13. Both earn big bonuses.</p><p>As a rule of thumb, think about a small slam when you and partner hold about 33 points together, and a grand slam with about 37.</p>`},
  {h:'Why ask for aces?',t:`<p>Even with plenty of points, a slam fails if the opponents can take two quick tricks with two Aces.</p><p>So before bidding a slam, find out how many Aces your partner holds. The two classic ways to ask are <b>Blackwood</b> and <b>Gerber</b>.</p>`},
  {h:'Blackwood: 4NT',t:`<p>Once your side has bid a suit, a bid of <b>4NT</b> asks partner, "How many Aces do you have?" Partner answers:</p><p><b>5♣</b> = 0 or 4 &nbsp;·&nbsp; <b>5♦</b> = 1 &nbsp;·&nbsp; <b>5♥</b> = 2 &nbsp;·&nbsp; <b>5♠</b> = 3</p><p>If your side is missing two Aces, stop at 5 of your suit.</p>`,ex:`You: 1♥ &nbsp; Partner: 3♥ &nbsp; You: 4NT<br>Partner: 5♥ = <b>two Aces</b>`},
  {h:'Asking for Kings',t:`<p>If your side holds all four Aces and you're thinking about a grand slam, bid <b>5NT</b> to ask for Kings:</p><p><b>6♣</b> = 0 or 4 &nbsp;·&nbsp; <b>6♦</b> = 1 &nbsp;·&nbsp; <b>6♥</b> = 2 &nbsp;·&nbsp; <b>6♠</b> = 3</p><p>Then you, the asker, choose the final contract. Partner simply answers.</p>`},
  {h:'Gerber: 4♣',t:`<p>When partner's last bid was notrump, jump to <b>4♣</b> to ask for Aces instead:</p><p><b>4♦</b> = 0 or 4 &nbsp;·&nbsp; <b>4♥</b> = 1 &nbsp;·&nbsp; <b>4♠</b> = 2 &nbsp;·&nbsp; <b>4NT</b> = 3</p><p>Then 5♣ asks for Kings. One more tip: after partner's 1NT, a jump to 4NT is <b>not</b> Blackwood. It invites 6NT, and partner bids it with a maximum.</p>`}
 ],exercise:{type:'quiz',items:[
  {q:'Your side has agreed on hearts and you bid 4NT. Partner answers 5♦. How many Aces does partner hold?',opts:['None','One','Two','Three'],a:1,why:'Over Blackwood, 5♦ shows one Ace.'},
  {q:'Partner opened 1NT. Which bid asks partner for Aces?',opts:['4♣','4NT','5NT','4♦'],a:0,why:'Over partner\'s notrump, a jump to 4♣ is Gerber, which asks for Aces.'},
  {q:'After Blackwood, you learn your side is missing two Aces. What should you do?',opts:['Bid 6 anyway','Stop at 5 of your suit','Bid 5NT to ask for Kings','Pass 4NT'],a:1,why:'With two Aces missing, the opponents can take two tricks right away, so stop at 5 of your suit.'},
  {q:'You bid 4♣ (Gerber) and partner answers 4♠. How many Aces does partner hold?',opts:['None','One','Two','Three'],a:2,why:'Over Gerber, 4♠ shows two Aces.'},
  {q:'Partner opened 1NT and you jumped to 4NT. What does that mean?',opts:['Blackwood, asking for Aces','An invitation to 6NT','Partner must pass','A sign-off in 4NT'],a:1,why:'After an all-notrump auction, 4NT invites slam. Partner bids 6NT with the top of their range.'}
 ]}},
 {title:'Weak two-bids',blurb:'Advanced: modern style',adv:true,pages:[
  {h:'A different kind of opening',t:`<p>In modern bridge, an opening bid of <b>2♦, 2♥ or 2♠</b> is a <b>weak two-bid</b>. It shows a good six-card suit and a weak hand: about 5 to 10 high-card points.</p><p><b>2♣</b> is the only strong two-bid. Open it with 22 or more points, just as before.</p>`},
  {h:'Why open a weak hand?',t:`<p>A weak two takes bidding room away from the opponents, and it tells partner almost exactly what you hold.</p><p>A good weak two has two of the top four honors (A, K, Q, J) in the suit, so partner can count on your six cards to take tricks.</p>`,ex:`♠ K Q J 9 7 4 &nbsp; ♥ 8 3 &nbsp; ♦ Q 6 2 &nbsp; ♣ 7 5<br>8 points, six good spades: <b>open 2♠</b>`},
  {h:'Answering a weak two',t:`<p>Partner's weak two is a narrow range, so you're the captain.</p><p>With support and about 15+ points, bid game: 4♥ or 4♠. With support and a <b>weak</b> hand, raise to 3. That blocks the opponents; it doesn't invite game. Otherwise, usually pass.</p>`}
 ],exercise:{type:'open',modern:true,cats:['weak2','1M','weak2','P','weak2','1m']}},
 {title:'Jacoby transfers',blurb:'Advanced: modern style',adv:true,pages:[
  {h:'The idea',t:`<p>When partner opens 1NT and you have five or more cards in a major suit, you usually want partner, the stronger hand, to be declarer.</p><p>A <b>Jacoby transfer</b> makes that happen, and it gives you an extra bid to describe your hand.</p>`},
  {h:'How it works',t:`<p>Bid the suit just <b>below</b> your major:</p><p><b>2♦</b> says "I have 5+ hearts." &nbsp;<b>2♥</b> says "I have 5+ spades."</p><p>Partner must bid your suit: 2♦ → 2♥, and 2♥ → 2♠. You can transfer with any strength, even zero points.</p>`,ex:`Partner: 1NT &nbsp; You: 2♦ (hearts!) &nbsp; Partner: 2♥`},
  {h:'Your next bid',t:`<p><b>0–7 points:</b> pass. Partner plays 2 of your major.</p><p><b>8–9:</b> bid 2NT with five cards, or 3 of your major with six. Both invite game.</p><p><b>10–15:</b> bid 3NT with five cards (partner picks 4 of your major with three-card support), or bid 4 of your major with six.</p>`},
  {h:'Over 2NT, too',t:`<p>Transfers work over a 2NT opening one level higher: <b>3♦</b> for hearts, <b>3♥</b> for spades.</p><p>Stayman (2♣) still works the same way when you have a four-card major instead of a five-card one.</p>`}
 ],exercise:{type:'nt',modern:true,cats:['xfer','xfer','stay','P','3N','xfer']}}


];

/* home */
function renderHome(){
  gen++;
  const g=$('lessonGrid');g.innerHTML='';
  LESSONS.forEach((L,i)=>{
    const done=!!store.lessons[i+1];
    const b=document.createElement('button');b.className='tile'+(done?' done':'');
    b.innerHTML=`<span class="num">${i+1}</span><div class="tt">${L.title}</div><div class="ts">${L.blurb}</div>${done?'<span class="ck">✓</span>':''}`;if(L.adv)b.classList.add('adv');
    b.onclick=()=>{sfx.tap();openLesson(i,0);};g.appendChild(b);
  });
  const lessonsDone=Object.keys(store.lessons).length;
  let s=`Lessons finished: <b>${lessonsDone} of ${LESSONS.length}</b>`;
  if(store.hands) s+=`<br>Practice hands played: <b>${store.hands}</b>, contracts made: <b>${store.made}</b>`;
  const stars=Object.values(store.ch||{}).filter(v=>v==='s').length;if(stars)s+=`<br>Challenge stars: <b>${stars} of ${CH.length}</b>`;
  if(store.jp&&store.jp.rounds)s+=`<br>Just Play best round: <b>${store.jp.best.toLocaleString()}</b> points`;
  $('statsLine').innerHTML=s;
  show('scrHome');
}

/* lesson pages */
let LS={i:0,p:0};
function openLesson(i,p){
  gen++;LS={i,p};const L=LESSONS[i],pg=L.pages[p];
  $('lsKicker').textContent=`Lesson ${i+1} of ${LESSONS.length}`;
  $('lsTitle').textContent=L.title;
  $('lsSheet').innerHTML=`<h3>${pg.h}</h3>${colorize(pg.t)}${pg.ex?ex(pg.ex):''}`;
  $('lsDots').innerHTML=L.pages.map((_,k)=>`<i class="${k===p?'on':''}"></i>`).join('');
  $('lsBack').textContent=p===0?'◀ Home':'◀ Back';
  $('lsNext').textContent=p===L.pages.length-1?'Practice ▶':'Next ▶';
  show('scrLesson');
}
$('lsBack').onclick=()=>{sfx.tap();if(LS.p===0)renderHome();else openLesson(LS.i,LS.p-1);};
$('lsNext').onclick=()=>{sfx.tap();const L=LESSONS[LS.i];if(LS.p<L.pages.length-1)openLesson(LS.i,LS.p+1);else startExercise(LS.i);};

/* exercises */
let EX=null;
function startExercise(i){
  gen++;const X=LESSONS[i].exercise;let items=[];const keepSys=SYS.modern;SYS.modern=!!X.modern;
  if(X.type==='quiz')items=X.items.map(q=>({kind:'quiz',...q}));
  else if(X.type==='points'){for(let k=0;k<X.n;k++){const h=dealHands().S;items.push({kind:'points',hand:h});}}
  else if(X.type==='open')items=shuffle(X.cats.slice()).map(c=>({kind:'bid',ctx:'open',...genOpeningEx(c)}));
  else if(X.type==='respond')items=X.cats.map(c=>({kind:'bid',ctx:'respond',...genRespondEx(c)}));
  else if(X.type==='nt')items=shuffle(X.cats.slice()).map(c=>({kind:'bid',ctx:'nt',...genNTEx(c)}));
  if(X.type==='respond')items=shuffle(items);
  SYS.modern=keepSys;
  EX={lesson:i,items,k:0,score:0};
  show('scrEx');renderEx();
}
function honorBreakdown(h){
  const parts=[];for(const c of sortHand(h))if(c.r>10)parts.push(`${cardTxt(c)} ${c.r-10}`);
  return parts.length?parts.join(' + ')+` = <b>${hcp(h)}</b>`:'No high cards: <b>0</b>';
}
function renderEx(){
  const it=EX.items[EX.k],L=LESSONS[EX.lesson];
  $('exTitle').textContent=L.title;
  $('exProg').textContent=`Question ${EX.k+1} of ${EX.items.length}`;
  $('exBody').querySelector('.results')?.remove();
  ['exPrompt','exAnswer','exFeedback','exNextRow'].forEach(id=>$(id).style.display='');
  $('exFeedback').style.visibility='hidden';
  $('exNext').disabled=true;
  $('exNext').textContent=EX.k===EX.items.length-1?'See results ▶':'Next ▶';
  const ans=$('exAnswer');ans.innerHTML='';
  if(it.kind==='quiz'){
    $('exHandWrap').style.display='none';
    $('exPrompt').innerHTML=colorize(it.q);
    const box=document.createElement('div');box.className='opts';
    it.opts.forEach((o,j)=>{const b=mkBtn(colorize(o),'',()=>answerChoice(j,box));box.appendChild(b);});
    ans.appendChild(box);
  }else if(it.kind==='points'){
    $('exHandWrap').style.display='';
    renderHand($('exHand'),sortHand(it.hand));
    $('exPrompt').innerHTML='How many <b>high-card points</b> are in this hand?';
    const right=hcp(it.hand);const set=new Set([right]);
    while(set.size<4){const d=right+[-3,-2,-1,1,2,3][Math.floor(Math.random()*6)];if(d>=0)set.add(d);}
    it.opts=shuffle([...set]);it.a=it.opts.indexOf(right);
    const box=document.createElement('div');box.className='opts four';
    it.opts.forEach((o,j)=>box.appendChild(mkBtn(String(o),'',()=>answerChoice(j,box))));
    ans.appendChild(box);
  }else{
    $('exHandWrap').style.display='';
    renderHand($('exHand'),sortHand(it.hand));
    const H=hcp(it.hand);
    if(it.ctx==='open')$('exPrompt').innerHTML=`You're first to bid. What is your <b>opening bid</b>?`;
    else $('exPrompt').innerHTML=`Partner opened <span class="chip">${colorize(bidText(it.opening))}</span>. What do you respond?`;
    const bb=document.createElement('div');bb.className='controls';ans.appendChild(bb);
    it.box={lastBid:it.opening||null,enabled:true,level:null,onBid:b=>answerBid(b,bb)};
    bidBox(bb,it.box);
  }
}
function answerChoice(j,box){
  const it=EX.items[EX.k];if(it.done)return;it.done=true;
  const btns=[...box.children];btns.forEach(b=>b.disabled=true);
  btns[it.a].disabled=false;btns[it.a].classList.add('right');
  const ok=j===it.a;
  if(!ok){btns[j].disabled=false;btns[j].classList.add('wrong');}
  if(ok){EX.score++;sfx.good();}else sfx.soft();
  const why=it.kind==='points'?honorBreakdown(it.hand):colorize(it.why);
  setCoach($('exFeedback'),(ok?'<b>Correct!</b> ':'<b>Not quite.</b> ')+why,ok?'good':'warn',24);
  $('exNext').disabled=false;
}
function answerBid(b,bb){
  const it=EX.items[EX.k];if(it.done)return;it.done=true;
  const ok=b===it.ans.bid;
  if(ok){EX.score++;sfx.good();}else sfx.soft();
  it.box.enabled=false;it.box.glow=it.ans.bid;it.box.level=it.ans.bid==='P'?null:+it.ans.bid[0];bidBox(bb,it.box);
  const msg=ok?`<b>Correct: ${colorize(bidText(b))}.</b> ${colorize(it.ans.why)}`:`<b>Not quite.</b> You bid ${colorize(bidText(b))}; the Standard American bid is <b>${colorize(bidText(it.ans.bid))}</b>. ${colorize(it.ans.why)}`;
  setCoach($('exFeedback'),msg,ok?'good':'warn',23);
  $('exNext').disabled=false;
}
$('exNext').onclick=()=>{sfx.tap();if(EX.k<EX.items.length-1){EX.k++;renderEx();}else showResults();};
function showResults(){
  const i=EX.lesson,n=EX.items.length;
  store.lessons[i+1]=true;save();
  ['exPrompt','exAnswer','exFeedback','exNextRow'].forEach(id=>$(id).style.display='none');
  $('exHandWrap').style.display='none';
  $('exProg').textContent='';
  const r=document.createElement('div');r.className='results';
  const msg=EX.score===n?'Perfect score. Well done!':EX.score>=n-1?'Very good work.':EX.score>=n/2?'A solid start. Practice makes perfect.':'Bridge takes practice. Try this lesson again any time.';
  r.innerHTML=`<div class="big">${EX.score} of ${n}</div><p>${msg}</p>`;
  const st=document.createElement('div');st.className='stack';
  if(i<LESSONS.length-1)st.appendChild(mkBtn(`Next lesson: ${LESSONS[i+1].title} ▶`,'primary',()=>{sfx.tap();openLesson(i+1,0);}));
  else st.appendChild(mkBtn('Play a Practice Hand ▶','primary',()=>{sfx.tap();startPractice();}));
  if(LESSONS[i].adv&&!store.modern)st.appendChild(mkBtn('Use modern bidding in practice','brass',()=>{sfx.tap();setModern(true);renderHome();}));
  st.appendChild(mkBtn('Try these questions again','',()=>{sfx.tap();startExercise(i);}));
  st.appendChild(mkBtn('Back to Home','',()=>{sfx.tap();renderHome();}));
  r.appendChild(st);
  $('exBody').appendChild(r);
  if(EX.score===n)sfx.win();
}

/* ================= PRACTICE TABLE ================= */
let T=null;
function startPractice(replay){
  gen++;
  const hands=replay&&T?T.orig:makePracticeDeal();
  const dealer=replay&&T?T.dealer:SEATS[Math.floor(Math.random()*4)];
  T={orig:hands,hands:{N:hands.N.slice(),E:hands.E.slice(),S:hands.S.slice(),W:hands.W.slice()},dealer,auction:[],turn:dealer,phase:'bid',contract:null,play:null,undo:[],suggest:null,glow:null,firstTry:true,revealed:false,busy:false,auto:false,watch:false,planShown:false,log:[],bbOpts:{level:null}};
  show('scrTable');
  coach(`New hand! ${SEATNAME[dealer]} deals and bids first. Your cards are at the bottom. Count your points while the bidding begins.`);
  renderTable();
  schedAuction(1100);
}
function coach(html,kind){setCoach($('tCoach'),colorize(html),kind,23);}
function stepAuction(){
  if(T.phase!=='bid')return;
  if(auctionOver(T.auction)){endAuction();return;}
  const seat=T.turn;

const LEVELS=[{n:1,name:'Beginner'},{n:2,name:'Intermediate'}];
let chLevel=1;
function chById(id){return CH.find(d=>d.id===id);}
function chStatus(id){return (store.ch||{})[id];}
function setChStatus(id,v){store.ch=store.ch||{};if(store.ch[id]==='s'&&v==='x')return;store.ch[id]=v;save();}
function openChallenges(level){

function chDefender(st,seat){if(!st.history.length&&!st.trick.length)return parseCard(T.deal.lead);return hybridDef(st,seat);}
function chEnd(){

function buildWalk(){
  const d=T.deal;DD.reset();const st=newPlay(T.orig,T.contract);const line=d.line.map(parseCard);let li=0;const steps=[];
  const cp=st=>({N:st.hands.N.slice(),E:st.hands.E.slice(),S:st.hands.S.slice(),W:st.hands.W.slice()});
  while(li<line.length&&!st.done){
    const before=cp(st);
    for(;;){const seat=st.turn;let c;
      if(isNS(seat))c=li<line.length?line[li++]:declarerHint(st,seat).card;
      else c=(!st.history.length&&!st.trick.length)?parseCard(d.lead):hybridDef(st,seat);
      playCard(st,seat,c);if(st.trick.length===4)break;}
    const cards=st.trick.slice();const w=finishTrick(st);
    steps.push({before,cards,winner:w.seat,ns:st.tricks.NS,ew:st.tricks.EW});
  }

function startWalk(){gen++;closeOverlay();T.paused=true;T.walk=buildWalk();T.phase='walk';renderWalk();}
function sideTxt(s,hand){const by=bySuit(hand);
  return `<div class="nm">${SEATNAME[s]}</div><div class="htxt">${['S','H','D','C'].map(u=>`<div>${colorize(SYM[u])} ${by[u].map(c=>rankStr(c.r)).join('')||'–'}</div>`).join('')}</div>`;}
function renderWalk(){
  const W=T.walk,i=W.i,n=W.steps.length,d=T.deal,last=i>=n,step=last?null:W.steps[i];
  const minus=(h,cards)=>h.filter(c=>!cards.some(t=>cardEq(t.card,c)));
  const H=last?W.after:{N:minus(step.before.N,step.cards),E:minus(step.before.E,step.cards),S:minus(step.before.S,step.cards),W:minus(step.before.W,step.cards)};
  const ns=last?(n?W.steps[n-1].ns:0):step.ns,ew=last?(n?W.steps[n-1].ew:0):step.ew;
  $('tBar').innerHTML=`<span><span class="pill">Solution</span> ${d.id}</span><span><span class="pill">${colorize(bidText(d.contract))}</span> by South</span><span>${last?'Summary':'Trick '+(i+1)}</span><span>Won <b>${ns}</b> · Lost <b>${ew}</b></span>`;
  renderHand($('nHand'),sortHand(H.N,d.contract[1]));renderHand($('sHand'),sortHand(H.S,d.contract[1]));
  $('nLabel').innerHTML='North (dummy)';$('sLabel').innerHTML='South (you)';
  $('wBox').innerHTML=sideTxt('W',H.W);$('eBox').innerHTML=sideTxt('E',H.E);
  const ctr=$('center');ctr.innerHTML='';
  if(last)ctr.innerHTML=`<div class="tmsg">From here, the remaining tricks are straightforward.</div>`;
  else for(const t of step.cards){const sl=document.createElement('div');sl.className='tslot '+t.seat;const ce=cardEl(t.card);if(t.seat===step.winner)ce.classList.add('win');sl.appendChild(ce);ctr.appendChild(sl);}
  coach(last?`<b>The key idea:</b> ${d.summary}`:(d.notes[i]||'Continue.'));
  const ctl=$('tControls');ctl.innerHTML='';
  const r=document.createElement('div');r.className='crow';
  r.appendChild(mkBtn('◀ Previous','',()=>{sfx.tap();W.i--;renderWalk();},i===0));
  r.appendChild(mkBtn(last?'Done':'Next ▶','primary',()=>{sfx.tap();if(last)openChallenges(d.level);else{W.i++;renderWalk();}}));
  ctl.appendChild(r);
  const r2=document.createElement('div');r2.className='crow';
  r2.appendChild(mkBtn('Try it myself','',()=>{sfx.tap();startChallenge(d.id);}));
  r2.appendChild(mkBtn('Back to the list','',()=>{sfx.tap();openChallenges(d.level);}));
  ctl.appendChild(r2);
}

function scoreHand(c,got){
  const need=c.level+6;if(got<need)return -50*(need-got);
  const per=c.strain==='N'||isMajor(c.strain)?30:20;
  const trick=c.strain==='N'?40+30*(c.level-1):per*c.level;
  let sc=trick+(trick>=100?300:50)+(got-need)*per;
  if(c.level===6)sc+=500;if(c.level===7)sc+=1000;return sc;
}
